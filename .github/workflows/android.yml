name: Build StudyMate APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project while preserving the existing default package ID
        run: flutter create --platforms=android .

      - name: Disable broken release lint task in generated Android project
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("android {", "android {" + chr(10) + "    lint { checkReleaseBuilds = false }", 1)
          p.write_text(s)
          PY
          elif [ -f android/app/build.gradle ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s = s.replace("android {", "android {" + chr(10) + "    lint { checkReleaseBuilds false }", 1)
          p.write_text(s)
          PY
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Generate StudyMate launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p assets/icon
          convert -background none assets/icon/app_icon.svg -resize 1024x1024 assets/icon/app_icon.png
          dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Verify APK archive and signature
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -t "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Generate APK SHA-256 checksum
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk > app-release.apk.sha256

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyMate-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK as a direct download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: StudyMate APK Build ${{ github.run_number }}
          prerelease: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
